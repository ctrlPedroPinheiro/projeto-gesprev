spring.application.name=gesprev
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
upload.dir=${UPLOAD_DIR:uploads}

gesprev.ai.provider=${AI_PROVIDER:openai-compatible}
gesprev.ai.llm-model=${AI_LLM_MODEL:${LLAMA_LLM_MODEL:qwen3-vl:latest}}
gesprev.ai.vlm-model=${AI_VLM_MODEL:${LLAMA_VLM_MODEL:qwen3-vl:latest}}
gesprev.ai.vlm.max-pages=${AI_VLM_MAX_PAGES:30}
gesprev.ai.vlm.render-dpi=${AI_VLM_RENDER_DPI:120}
gesprev.ai.vlm.num-context=${AI_VLM_NUM_CONTEXT:32768}
gesprev.ai.vlm.num-predict=${AI_VLM_NUM_PREDICT:8192}
gesprev.ai.ocr.enabled=${AI_OCR_ENABLED:false}
gesprev.ai.ocr.command=${AI_OCR_COMMAND:}
gesprev.ai.ocr.timeout-seconds=${AI_OCR_TIMEOUT_SECONDS:120}
gesprev.ai.ocr.render-dpi=${AI_OCR_RENDER_DPI:150}
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.openai.base-url=${LLAMA_BASE_URL:http://localhost:11434/v1}
spring.ai.openai.api-key=${LLAMA_API_KEY:ollama}
spring.ai.openai.chat.model=${gesprev.ai.llm-model}
spring.ai.retry.max-attempts=1

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:gesprev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none

spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:gesprev}
spring.flyway.default-schema=${DB_SCHEMA:gesprev}
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.schemaName=${DB_SCHEMA:gesprev}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
