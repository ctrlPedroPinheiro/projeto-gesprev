gesprev.ai.provider=openai-compatible
gesprev.ai.llm-model=${LLAMA_LLM_MODEL:meta-llama/Llama-3.3-70B-Instruct}
gesprev.ai.vlm-model=${LLAMA_VLM_MODEL:Qwen3-VL}

spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.openai.base-url=${LLAMA_BASE_URL:http://localhost:8000/v1}
spring.ai.openai.api-key=${LLAMA_API_KEY:local}
spring.ai.openai.chat.model=${gesprev.ai.llm-model}
spring.ai.retry.max-attempts=3

gesprev.rag.url=${RAG_SERVICE_URL:http://localhost:8001}
