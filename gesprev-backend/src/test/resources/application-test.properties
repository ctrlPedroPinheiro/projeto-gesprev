spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=gesprev_test
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.schemas=gesprev_test
spring.flyway.default-schema=gesprev_test
spring.flyway.locations=classpath:db/migration,classpath:db/test-migration
spring.flyway.placeholders.schemaName=gesprev_test
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=true

jwt.secret=chave-jwt-exclusiva-para-testes-automatizados-gesprev
jwt.expiration=3600000
upload.dir=target/test-uploads

gesprev.ai.provider=mock
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
